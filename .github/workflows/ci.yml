name: CI

on:
  push:
    branches:
      - main
      - asfoury
  pull_request:
    branches:
      - main
      - asfoury

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend install and tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - Backend/auth_service
          - Backend/profile_service
          - Backend/job_service
          - Backend/ai_service
          - Backend/document_service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
        working-directory: ${{ matrix.service }}

      - name: Run tests if available
        run: npm test --if-present
        working-directory: ${{ matrix.service }}

  docker:
    name: Docker Compose build
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CI env files
        run: |
          cat > .env <<'EOF'
          MONGO_INITDB_ROOT_USERNAME=admin
          MONGO_INITDB_ROOT_PASSWORD=admin123
          ME_CONFIG_BASICAUTH_USERNAME=admin
          ME_CONFIG_BASICAUTH_PASSWORD=admin123
          EOF

          cat > Backend/auth_service/.env <<'EOF'
          PORT=5000
          NODE_ENV=test
          MONGO_URI=mongodb://admin:admin123@mongodb:27017/cv_ai_db?authSource=admin
          JWT_SECRET=ci_test_secret
          JWT_EXPIRES_IN=1d
          MONGO_INITDB_ROOT_USERNAME=admin
          MONGO_INITDB_ROOT_PASSWORD=admin123
          ME_CONFIG_BASICAUTH_USERNAME=admin
          ME_CONFIG_BASICAUTH_PASSWORD=admin123
          EOF

          cat > Backend/profile_service/.env <<'EOF'
          PORT=5001
          NODE_ENV=test
          MONGO_URI=mongodb://admin:admin123@mongodb:27017/cv_ai_db?authSource=admin
          JWT_SECRET=ci_test_secret
          JWT_EXPIRES_IN=1d
          EOF

          cat > Backend/job_service/.env <<'EOF'
          PORT=5002
          NODE_ENV=test
          MONGO_URI=mongodb://admin:admin123@mongodb:27017/cv_ai_db?authSource=admin
          JWT_SECRET=ci_test_secret
          JWT_EXPIRES_IN=1d
          EOF

          cat > Backend/ai_service/.env <<'EOF'
          PORT=5003
          MONGO_URI=mongodb://admin:admin123@mongodb:27017/cv_ai_db?authSource=admin
          JWT_SECRET=ci_test_secret
          JWT_EXPIRES_IN=1d
          EOF

      - name: Build Docker images
        run: docker compose build
